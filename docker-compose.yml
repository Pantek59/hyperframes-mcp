services:
  hyperframes-mcp:
    build:
      context: https://github.com/Pantek59/hyperframes-mcp.git#main
      dockerfile: Dockerfile
    image: hyperframes-mcp:latest
    restart: unless-stopped
    environment:
      # Set a token to require "Authorization: Bearer <token>" on every call
      # (except the public /health). Leave empty to keep the endpoint open.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_TRANSPORT: http
      HF_WORKSPACE: /data/projects
      HF_JOBS_DIR: /data/jobs
      # Rendering and transcription are CPU-bound; this limit applies to all jobs.
      HF_JOB_CONCURRENCY: ${HF_JOB_CONCURRENCY:-1}
      HF_WAIT_MAX_MS: ${HF_WAIT_MAX_MS:-600000}
      HF_JOB_TAIL_LINES: ${HF_JOB_TAIL_LINES:-200}
      # Public files host (no trailing slash). When set, render jobs return a
      # public download `url` per file under <project>/renders/**.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Unguessable render filenames (default true; false restores legacy
      # CLI naming and the raw -o handling — local use only).
      HF_RANDOMIZE_OUTPUT: ${HF_RANDOMIZE_OUTPUT:-true}
      # Optional defence in depth: restrict /files/ to <project>/<prefix>/….
      # Empty = off; "true" = renders; or a comma-separated prefix list.
      HF_FILES_PUBLIC_PREFIX_ONLY: ${HF_FILES_PUBLIC_PREFIX_ONLY:-}
      # Optional OpenAI-compatible TTS-API endpoint (/v1/audio/speech); model and voice are deployment-specific.
      TTS_API_BASE_URL: ${TTS_API_BASE_URL:-}
      TTS_API_MODEL: ${TTS_API_MODEL:-}
      TTS_API_VOICE: ${TTS_API_VOICE:-}
      TTS_API_API_KEY: ${TTS_API_API_KEY:-}
      TTS_API_TIMEOUT_MS: ${TTS_API_TIMEOUT_MS:-300000}
      TTS_API_MAX_TEXT_BYTES: ${TTS_API_MAX_TEXT_BYTES:-65536}
      TTS_API_MAX_AUDIO_BYTES: ${TTS_API_MAX_AUDIO_BYTES:-26214400}
      # Local CPU-only WhisperX. The named volume preserves model/alignment downloads.
      WHISPERX_EXECUTABLE: ${WHISPERX_EXECUTABLE:-/opt/whisperx-venv/bin/whisperx}
      WHISPERX_MODEL: ${WHISPERX_MODEL:-base}
      WHISPERX_MODEL_CACHE_DIR: ${WHISPERX_MODEL_CACHE_DIR:-/data/whisperx-cache}
      WHISPERX_TIMEOUT_MS: ${WHISPERX_TIMEOUT_MS:-1800000}
      WHISPERX_MAX_AUDIO_BYTES: ${WHISPERX_MAX_AUDIO_BYTES:-524288000}
      WHISPERX_MAX_JSON_BYTES: ${WHISPERX_MAX_JSON_BYTES:-20971520}
      PORT: "8080"
    volumes:
      - hf-mcp-projects:/data/projects
      - hf-mcp-jobs:/data/jobs
      - "hf-mcp-whisperx:${WHISPERX_MODEL_CACHE_DIR:-/data/whisperx-cache}"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.hf-mcp-web.rule=Host(`hyperframes-mcp.lab.whitelabel.lat`)
      - traefik.http.routers.hf-mcp-web.entrypoints=web
      - traefik.http.routers.hf-mcp-web.service=hf-mcp-web
      - traefik.http.routers.hf-mcp-web.middlewares=redirect-to-https@file

      - traefik.http.routers.hf-mcp-websecure.rule=Host(`hyperframes-mcp.lab.whitelabel.lat`)
      - traefik.http.routers.hf-mcp-websecure.entrypoints=websecure
      - traefik.http.routers.hf-mcp-websecure.service=hf-mcp-websecure
      - traefik.http.routers.hf-mcp-websecure.tls.certresolver=letsencrypt

      - traefik.http.services.hf-mcp-web.loadbalancer.server.port=8080
      - traefik.http.services.hf-mcp-websecure.loadbalancer.server.port=8080
    networks:
      - dokploy-network

volumes:
  hf-mcp-projects:
  hf-mcp-jobs:
  hf-mcp-whisperx:

networks:
  dokploy-network:
    external: true
